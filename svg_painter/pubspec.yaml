name: svg_painter
description: A code generator that compiles SVG files into Flutter CustomPainter code.
version: 0.3.0
resolution: workspace
repository: https://github.com/tekneurt/svg_painter/tree/master/svg_painter
homepage: https://github.com/tekneurt/svg_painter
issue_tracker: https://github.com/tekneurt/svg_painter/issues

environment:
  sdk: ^3.11.3

dependencies:
  # meta is pinned to 1.17.0 by the Flutter SDK in 3.41.5
  meta: ^1.17.0
  analyzer: ^12.0.0
  build: ^4.0.5
  source_gen: ^4.2.2
  svg_painter_annotation: ^0.3.0
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.13.1
  build_test: ^3.5.12
  crypto: ^3.0.7
  dart_style: ^3.1.8
  glob: ^2.1.3
  mockito: ^5.6.3
  package_config: ^2.2.0
  path: ^1.9.1
  test: ^1.31.0

dependency_overrides:
  # Required to resolve conflict between dart_style ^3.1.8 (needs analyzer 12) 
  # and mockito ^5.6.3 (needs analyzer <11). 
  # Can be removed once mockito supports analyzer 12.
  analyzer: ^12.0.0
  # Required to resolve conflict between analyzer 12 (needs meta 1.18)
  # and Flutter SDK 3.41.5 (pins meta to 1.17.0).
  meta: ^1.17.0
