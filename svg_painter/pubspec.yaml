name: svg_painter
description: A code generator that compiles SVG files into Flutter CustomPainter code.
version: 0.0.1
repository: https://github.com/tekneurt/svg_painter/tree/master/svg_painter
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  meta: ^1.17.0
  analyzer: ^9.0.0
  build: ^4.0.3
  code_builder: ^4.10.0
  dart_style: ^3.1.3
  path: ^1.9.0
  source_gen: ^4.1.1
  svg_painter_annotation:
    path: ../svg_painter_annotation
  xml: ^6.5.0

dev_dependencies:
  build_runner: ^2.4.8
  build_test: ^3.5.4
  lints: ^6.0.0
  mockito: ^5.6.1
  test: ^1.28.0
