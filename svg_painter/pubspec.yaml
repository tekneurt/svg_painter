name: svg_painter
description: A code generator that compiles SVG files into Flutter CustomPainter code.
version: 0.2.0
repository: https://github.com/tekneurt/svg_painter/tree/master/svg_painter
homepage: https://github.com/tekneurt/svg_painter
issue_tracker: https://github.com/tekneurt/svg_painter/issues

environment:
  sdk: ^3.10.4

dependencies:
  meta: ^1.17.0
  analyzer: ^9.0.0
  build: ^4.0.3
  code_builder: ^4.10.0
  dart_style: ^3.1.3
  path: ^1.9.0
  source_gen: ^4.1.1
  svg_painter_annotation: ^0.2.0
  xml: ^6.5.0

# TODO(Gemini): Remove this override after publishing svg_painter_annotation 0.2.0.
# This override is required to support local development and CI until the package is published.
dependency_overrides:
  svg_painter_annotation:
    path: ../svg_painter_annotation

dev_dependencies:
  build_runner: ^2.4.8
  build_test: ^3.5.4
  crypto: ^3.0.6
  glob: ^2.1.2
  lints: ^6.0.0
  mockito: ^5.6.1
  package_config: ^2.1.0
  test: ^1.28.0
