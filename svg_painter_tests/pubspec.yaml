name: svg_painter_tests
description: Golden test suite for the svg_painter package, validating SVG to CustomPainter code generation visually.
publish_to: none

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  svg_painter_annotation:
    path: ../svg_painter_annotation
  svg_painter_fixtures:
    path: ../svg_painter_fixtures

dev_dependencies:
  flutter_test:
    sdk: flutter
  svg_painter:
    path: ../svg_painter
  build_runner: ^2.10.4

dependency_overrides:
  svg_painter_annotation:
    path: ../svg_painter_annotation
